<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="BarMGR Settings - Configure your bar management system with shop selection and settings." />
  <meta name="theme-color" content="#0a0906" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Ρυθμίσεις | BarMGR</title>

  <link rel="stylesheet" href="../static/settings.css">
</head>

<body>

  <header class="settings-header">
    <a href="../index.html" class="back-link">
      <span class="back-icon">←</span>
      <span>Επιστροφή</span>
    </a>
  </header>

  <main class="settings-page">

    <h1>Επιλογή Μαγαζιού</h1>

    <section class="shop-grid">

      <a href="settings-cafe.html" class="shop-card">

        <div class="shop-icon">
          <img 
            src="../icons/coffee.png" 
            alt="Coffee Icon"
          >
        </div>

        <h2>Καφέ</h2>

        <p>
          Διαχείριση αποθήκης και κάβας καφέ
        </p>

      </a>

      <a href="settings-bar.html" class="shop-card">

        <div class="shop-icon">
          <img 
            src="../icons/wine.png" 
            alt="Wine Icon"
          >
        </div>

        <h2>Μπαρ</h2>

        <p>
          Διαχείριση αποθήκης και κάβας μπαρ
        </p>

      </a>

    </section>

    <section class="history-cta">
      <a href="history.html" class="shop-card history-button no-icon" aria-label="Ιστορικό">
        <span>
          <strong>Ιστορικό</strong>
          <small>Δες όλες τις κινήσεις του συστήματος</small>
        </span>
      </a>
    </section>

  </main>

</body>
</html>
