<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="BarMGR Settings - Configure your bar management system with shop selection and settings." />
  <meta name="theme-color" content="#0a0906" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Ρυθμίσεις | BarMGR</title>

  <link rel="stylesheet" href="../static/settings.css">
</head>

<body>

  <header class="settings-header">
    <a href="../index.html" class="back-link">
      <span class="back-icon">←</span>
      <span>Επιστροφή</span>
    </a>
  </header>

  <main class="settings-page">

    <h1>Καφέ</h1>

    <section class="shop-grid">

      <a href="#" class="shop-card">

        <div class="shop-icon">
          <img 
            src="../icons/warehouse.png" 
            alt="Warehouse Icon"
          >
        </div>

        <h2>Αποθήκη</h2>

        <p>
          Διαχείριση αποθήκης με κωδικό πρόσβασης
        </p>

      </a>

      <a href="#" class="shop-card">

        <div class="shop-icon">
          <img 
            src="../icons/cellar.png" 
            alt="Cellar Icon"
          >
        </div>

        <h2>Κάβα</h2>

        <p>
          Μεταφορά προϊόντων στο μαγαζί
        </p>

      </a>

    </section>

  </main>

</body>
</html>
