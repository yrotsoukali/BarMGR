<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0906" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="BarMGR Cafe Warehouse page." />
  <title>Αποθήκη Καφέ | BarMGR</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0f0c08;
      --panel: rgba(255, 255, 255, 0.06);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text: #f5efe6;
      --muted: #c8b9aa;
      --accent: #d7a86e;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(215, 168, 110, 0.2), transparent 42%),
        linear-gradient(180deg, #19130d 0%, var(--bg) 100%);
      color: var(--text);
      padding: 24px;
    }

    .panel {
      width: min(100%, 560px);
      padding: 34px;
      border-radius: 24px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 12px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.78rem;
      color: var(--muted);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 2.8rem);
      line-height: 1.1;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(215, 168, 110, 0.14);
      color: #f1c28b;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="panel">
    <p class="eyebrow">Καφέ · Αποθήκη</p>
    <h1>Η αποθήκη άνοιξε</h1>
    <p>Η είσοδος έγινε με επιτυχία και μπορείς να συνεχίσεις στη διαχείριση της αποθήκης του καφέ.</p>
    <div class="badge">Κωδικός αποδεκτός</div>
  </main>
</body>
</html>
